# Banco de dados do HajimeTech para desenvolvimento local.
#
# Subir:      docker compose up -d        (dentro da pasta database)
# Parar:      docker compose down
# Recriar do zero (apaga os dados): docker compose down -v && docker compose up -d
#
# Na primeira vez, o PostgreSQL executa schema.sql e seed.sql automaticamente.
# Porta 5433 no computador, para não conflitar com um PostgreSQL já instalado na 5432.
# Credenciais apenas para desenvolvimento local.

name: hajimetech

services:
  db:
    image: postgres:16-alpine
    container_name: hajimetech-db
    environment:
      POSTGRES_DB: hajimetech
      POSTGRES_USER: hajimetech
      POSTGRES_PASSWORD: hajimetech
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5433:5432"
    volumes:
      - dados:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hajimetech -d hajimetech"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dados:
